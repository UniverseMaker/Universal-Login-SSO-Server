<!-- 캐시 정책 — 아래 ?v= 와 meta 는 성격이 다르다. 지우기 전에 읽어라.
     자산 URL 의 ?v={버전} 이 배포 반영의 **주 수단**이다. 서버 설정·mod_headers·
     프록시에 전혀 의존하지 않는다 — 버전이 바뀌면 URL 이 바뀌고, 브라우저에게는
     처음 보는 URL 이므로 무조건 새로 받는다. "쿼리스트링이 지저분하다"는 이유로
     지우면 새 버전을 올려도 반영되지 않는 문제가 그대로 돌아온다.
     값 일괄 변경은 tools/bump_asset_version.php 로 한다(손으로 고치지 마라).
     아래 meta 는 **보조 수단이다.** 현대 브라우저는 http-equiv="Cache-Control" 을
     무시할 수 있다(HTTP 헤더만 신뢰). 주 방어는 public/.htaccess 의 no-store 이며,
     이 meta 를 캐시 무효화의 주 수단으로 믿으면 안 된다. -->
<meta http-equiv="Cache-Control" content="no-store">
<!-- 공용 테마 (research-ui G17) — v1.8.6 / 리더 판정 D-337·D-342
     공용 파일 셋(rui-theme.js · rui-tokens.css · rui.css)은 research-ui 원본을 **바이트 그대로** 복사했다.
     ulogin 전용 보정은 따로 둔다:
       · rui-ulogin-pre.js — rui-theme.js 보다 **먼저**. `?rui=` 인계가 SSO 쿼리·일회용 토큰을 지우지 않게
       · rui-layer.css     — rui.css 를 cascade layer 로 불러 style.css 와의 클래스 충돌(D-236)을 푼다
       · ulogin-theme.css  — 화면 모양 보정(G16 로그인 틀 안의 ulogin 요소 · 공통 테마 2 · Pretendard 파일)
       · ulogin-shell.js   — G16 `RUI.login` 틀을 세우고 이 화면의 카드(#ul-pane)를 폼 자리에 넣는다
       · theme-ui.js       — 화면 설정(RUI.picker, 인라인 style 을 CSSOM 으로 옮긴다) · 밝기 · 버전 뱃지

     rui-theme.js 를 **스타일시트보다 먼저, head 에서** 부른다. <html> 에 data-rui-* 를 세우므로
     첫 그리기부터 색이 맞는다(GUIDE "새 앱에 쓰기").

     <html data-rui-font>: RUI.font() 의 jsdelivr 주입을 끈다(CSP style-src·font-src 'self').
     글꼴은 assets/PretendardVariable.woff2 를 직접 둔다(GUIDELINE 3장 — 외부 글꼴을 막는 서버).
     **CSP 를 넓히지 않는다** — 그것이 이 화면들의 방어다. -->
<script src="assets/rui-ulogin-pre.js?v=1.10.2"></script>

    <!-- v1.10.1 가입 신청 결과 확인(접수번호는 본문으로만 보낸다) -->

<script src="assets/ulogin-shell.js?v=1.10.2"></script>
<script src="assets/api.js?v=1.10.2"></script>
<script src="assets/ui.js?v=1.10.2"></script>
<script>
/* ============================================================================
 * register.html — 회원가입
 *
 * 계약: POST /api/auth/register
 *   응답 data: user, email_verification_required, granted_points, auto_login
 *   auto_login 은 v1.0.0 에서 항상 false — 가입 직후 토큰이 나오지 않는다.
 *
 * 아이디 중복 확인 전용 엔드포인트는 계약에 없다.
 * blur 시에는 **형식 검사만** 하고, 중복은 제출 시 DUPLICATE_USERNAME /
 * DUPLICATE_EMAIL 로 받아 필드 옆에 표시한다.
 * ========================================================================== */
(function () {
  'use strict';

  var SSO_KEEP = ['service_id', 'redirect_uri', 'state', 'code_challenge'];
  var PREFILL_KEY = 'ulogin_prefill_username';

  var qs = new URLSearchParams(location.search);
  function param(k) { var v = qs.get(k); return v === null ? '' : v.trim(); }

  var sso = { service_id: param('service_id'), redirect_uri: param('redirect_uri') };
  var ssoMode = !!(sso.service_id && sso.redirect_uri);
  var regMode = 'open';   // v1.10.1: register_status.register_mode (closed|approval|open)
  var entryParam = param('entry');

  function withSso(target) {
    var next = new URLSearchParams();
    SSO_KEEP.forEach(function (k) {
      if (qs.has(k) && qs.get(k) !== '') { next.set(k, qs.get(k)); }
    });
    var q = next.toString();
    return q ? target + '?' + q : target;
  }

  /* ---- 엘리먼트 ------------------------------------------------------ */
  var cardReg = $('#register-card');
  var cardDone = $('#done-card');
  var doneBody = $('#done-body');
  var doneFoot = $('#done-foot');
  var form = $('#register-form');
  var btn = $('#submit-btn');
  var coolNote = $('#cooldown-note');
  var ssoNote = $('#sso-note');

  var inUsername = $('#reg-username');
  var inEmail = $('#reg-email');
  var inPw = $('#reg-password');
  var inPw2 = $('#reg-password-confirm');
  var inName = $('#reg-name');
  var inNick = $('#reg-nickname');
  var inPhone = $('#reg-phone');
  var cbTos = $('#agree-tos');
  var cbPrivacy = $('#agree-privacy');
  var cbMarketing = $('#marketing-agreed');

  var strength = $('#pw-strength');
  var strengthText = $('#pw-strength-text');
  var matchNote = $('#pw-match');

  /* ---- 링크에 SSO 파라미터 유지 --------------------------------------- */
  $('#link-login').setAttribute('href', withSso('login.html'));
  $('#nav-login').setAttribute('href', withSso('login.html'));
  $('#closed-login').setAttribute('href', withSso('login.html'));
  if (ssoMode) {
    ssoNote.hidden = false;
    ssoNote.textContent = '가입 후 요청한 앱의 로그인 화면으로 복귀';
  }

  /* ---- 쿨다운 (api.js/ui.js 에 없어 화면에서 구현) -------------------- */
  var coolTimer = null;
  function startCooldown(seconds) {
    var left = Math.max(0, Math.floor(Number(seconds) || 0));
    if (coolTimer) { clearInterval(coolTimer); coolTimer = null; }
    if (!left) { btn.disabled = false; coolNote.hidden = true; return; }
    btn.disabled = true;
    coolNote.hidden = false;
    var tick = function () {
      if (left <= 0) {
        clearInterval(coolTimer); coolTimer = null;
        btn.disabled = false;
        coolNote.textContent = '다시 시도할 수 있습니다.';
        return;
      }
      coolNote.textContent = '다시 시도까지 ' + fmtDuration(left) + ' 남았습니다.';
      left -= 1;
    };
    tick();
    coolTimer = setInterval(tick, 1000);
  }

  /* ---- 비밀번호 강도 (클라이언트 계산) -------------------------------- */
  /** 계약 검증 규칙과 같은 축으로 센다: 길이 + (영문/숫자/특수) 종류 수 */
  function pwClasses(pw) {
    var n = 0;
    if (/[A-Za-z]/.test(pw)) { n += 1; }
    if (/[0-9]/.test(pw)) { n += 1; }
    if (/[^A-Za-z0-9]/.test(pw)) { n += 1; }
    return n;
  }

  function pwLevel(pw) {
    if (!pw) { return 0; }
    var kinds = pwClasses(pw);
    var len = pw.length;
    if (len < 8 || kinds < 2) { return 1; }          // 서버 규칙 미달
    if (len >= 12 && kinds >= 3) { return 4; }
    if (len >= 10 || kinds >= 3) { return 3; }
    return 2;
  }

  var LEVEL_TEXT = {
    0: '',
    1: '사용할 수 없습니다. 8자 이상, 영문·숫자·특수문자 중 2종류 이상이 필요합니다.',
    2: '보통: 길이를 늘리거나 문자 종류를 추가하면 더 안전합니다.',
    3: '양호',
    4: '강함'
  };

  function renderStrength() {
    var lv = pwLevel(inPw.value);
    strength.setAttribute('data-level', String(lv));
    strengthText.textContent = LEVEL_TEXT[lv] || '';
  }

  function renderMatch() {
    if (!inPw2.value) { matchNote.textContent = ''; return; }
    matchNote.textContent = (inPw.value === inPw2.value)
      ? '비밀번호가 일치합니다.'
      : '비밀번호가 일치하지 않습니다.';
  }

  inPw.addEventListener('input', function () { renderStrength(); renderMatch(); });
  inPw2.addEventListener('input', renderMatch);

  /* ---- blur 시 형식 검사 (중복 확인 API 는 계약에 없다) --------------- */
  var USERNAME_RE = /^[a-z0-9_]{4,20}$/;

  function fieldError(name, msg) {
    formErrors(form, { code: 'VALIDATION_FAILED', message: msg, field: name });
  }

  inUsername.addEventListener('blur', function () {
    var v = inUsername.value.trim().toLowerCase();
    if (v && v !== inUsername.value) { inUsername.value = v; }   // 서버와 같게 소문자 정규화
    if (!v) { return; }
    if (!USERNAME_RE.test(v)) {
      fieldError('username', '영문 소문자·숫자·밑줄(_) 4~20자로 입력해 주세요.');
    }
  });

  inEmail.addEventListener('blur', function () {
    var v = inEmail.value.trim();
    if (v && v !== inEmail.value) { inEmail.value = v; }
    if (!v) { return; }
    if (v.length > 190 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      fieldError('email', '이메일 주소 형식을 확인해 주세요.');
    }
  });

  /* ---- 제출 전 클라이언트 검증 ---------------------------------------- */
  function validate() {
    var username = inUsername.value.trim().toLowerCase();
    var email = inEmail.value.trim();
    var pw = inPw.value;
    var pw2 = inPw2.value;

    if (!USERNAME_RE.test(username)) {
      return { field: 'username', message: '영문 소문자·숫자·밑줄(_) 4~20자로 입력해 주세요.' };
    }
    if (!email || email.length > 190 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return { field: 'email', message: '이메일 주소 형식을 확인해 주세요.' };
    }
    if (pw.length < 8) {
      return { field: 'password', message: '비밀번호는 8자 이상이어야 합니다.' };
    }
    if (pwClasses(pw) < 2) {
      return { field: 'password', message: '영문·숫자·특수문자 중 2종류 이상을 섞어 주세요.' };
    }
    if (pw.toLowerCase() === username) {
      return { field: 'password', message: '아이디와 같은 문자열은 비밀번호로 쓸 수 없습니다.' };
    }
    if (pw !== pw2) {
      return { field: 'password_confirm', message: '비밀번호가 일치하지 않습니다.' };
    }
    if (!cbTos.checked) {
      return { field: 'agree_tos', message: '이용약관에 동의해야 가입할 수 있습니다.' };
    }
    if (!cbPrivacy.checked) {
      return { field: 'agree_privacy', message: '개인정보 수집·이용에 동의해야 가입할 수 있습니다.' };
    }
    return null;
  }

  /* ---- 가입 완료 화면 ------------------------------------------------- */
  function showDone(data) {
    var user = (data && data.user) || {};
    var needVerify = !!(data && data.email_verification_required);
    var points = (data && typeof data.granted_points === 'number') ? data.granted_points : 0;
    var autoLogin = !!(data && data.auto_login);

    clear(doneBody);
    clear(doneFoot);

    /* 사용자 데이터는 전부 el()/textContent 로만 그린다. */
    doneBody.appendChild(el('p', null, [
      el('strong', { text: String(user.username || '') }),
      text(' 계정이 만들어졌습니다.')
    ]));

    if (user.email) {
      doneBody.appendChild(el('p', { class: 'text-sm text-muted' }, [
        text('가입 이메일: '), el('span', { class: 'mono', text: String(user.email) })
      ]));
    }

    if (points > 0) {
      doneBody.appendChild(alertNode(
        '가입 축하 포인트 ' + fmtNum(points) + 'P가 지급되었습니다.', 'success'));
    }

    if (needVerify) {
      /* leader_decisions D-5: require_email_verify=1 이면 인증 전에는 로그인이 막힌다. */
      doneBody.appendChild(alertNode(
        '가입 확인용 이메일 인증 필요, 받은 메일의 링크로 인증 완료 후 로그인 가능',
        'warn'));
      doneBody.appendChild(el('p', { class: 'text-sm text-muted' },
        '메일 미수신 시 로그인 화면의 "인증 메일 재발송" 이용'));
    } else if (autoLogin) {
      doneBody.appendChild(el('p', { class: 'text-sm text-muted' }, '로그인된 상태로 바로 이동'));
    } else {
      doneBody.appendChild(el('p', { class: 'text-sm text-muted' },
        '보안상 가입과 로그인 분리, 방금 만든 계정으로 로그인 필요'));
    }

    /* 다음 화면: SSO 파라미터가 있으면 로그인 화면으로 그대로 넘겨 원래 앱으로 복귀시킨다. */
    var next;
    if (ssoMode) { next = withSso('login.html'); }
    else if (autoLogin) { next = 'mypage.html'; }
    else { next = 'login.html'; }

    var label = (next.indexOf('login.html') === 0) ? '로그인하기' : '내 시스템으로 이동';
    doneFoot.appendChild(el('a', { class: 'btn btn-primary', href: next }, label));

    /* 아이디를 로그인 화면이 한 번만 프리필하도록 넘긴다(1회성, sessionStorage). */
    try { sessionStorage.setItem(PREFILL_KEY, String(user.username || '')); } catch (e) { /* noop */ }

    cardReg.hidden = true;
    cardDone.hidden = false;

    /* 이메일 인증이 필요하면 자동 이동하지 않는다 — 안내를 읽어야 한다. */
    if (!needVerify) {
      setTimeout(function () { navigate(next, true); }, 2500);
      doneFoot.appendChild(el('span', { class: 'text-xs text-muted' }, '잠시 후 자동 이동'));
    }
  }

  /* ---- 가입 신청 접수 화면 (v1.10.1, 202 approval_required) -------------
   * data.receipt 는 이 응답에서만 볼 수 있다(원문 재조회 불가). 복사 버튼을 둔다. */
  function showRequested(data) {
    clear(doneBody);
    clear(doneFoot);
    cardDone.querySelector('h1').textContent = '가입 신청이 접수되었습니다';
    doneBody.appendChild(alertNode('신청이 접수됐습니다. 관리자 승인 후 로그인할 수 있습니다.', 'success'));
    var rc = String((data && data.receipt) || '');
    if (rc) {
      doneBody.appendChild(el('p', { class: 'text-sm' }, '접수번호 (다시 볼 수 없으니 보관해 주세요)'));
      doneBody.appendChild(el('p', { class: 'mono', id: 'receipt-val', style: 'word-break:break-all', text: rc }));
      doneFoot.appendChild(el('button', { class: 'btn btn-secondary', type: 'button', on: { click: function (ev) {
        var b = ev.currentTarget;
        function ok() { b.textContent = '복사됨'; }
        try { navigator.clipboard.writeText(rc).then(ok, function () { fallbackCopy(rc); ok(); }); }
        catch (e) { fallbackCopy(rc); ok(); }
      } } }, '접수번호 복사'));
    }
    doneFoot.appendChild(el('a', { class: 'btn btn-ghost', href: withSso('login.html') }, '로그인 화면으로'));
    cardReg.hidden = true;
    cardDone.hidden = false;
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { /* noop */ }
    document.body.removeChild(ta);
  }

  var STATUS_LABEL = { pending: '심사 대기 중', approved: '승인됨. 로그인할 수 있습니다', rejected: '승인되지 않았습니다', expired: '신청 기간이 지났습니다' };
  $('#open-status').addEventListener('click', function () {
    cardReg.hidden = true; $('#status-card').hidden = false;
    try { $('#st-receipt').focus(); } catch (e) { /* noop */ }
  });
  $('#status-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = $('#status-form'), out = $('#st-result'), sb = $('#st-btn');
    clearFormErrors(f); clear(out);
    var rc = $('#st-receipt').value.trim();
    if (!rc) { formErrors(f, { code: 'VALIDATION_FAILED', message: '접수번호를 입력해 주세요.', field: 'receipt' }); return; }
    setBusy(sb, true);
    apiPost('/api/auth/register_request_status', { receipt: rc })
      .then(function (d) {
        setBusy(sb, false);
        out.appendChild(alertNode(STATUS_LABEL[d.status] || String(d.status || ''), d.status === 'approved' ? 'success' : (d.status === 'pending' ? 'info' : 'warn')));
        if (d.created_at) { out.appendChild(el('p', { class: 'text-xs text-muted', text: '신청 ' + d.created_at })); }
        if (d.notice) { out.appendChild(el('p', { class: 'text-sm', text: '안내: ' + d.notice })); }
      })
      .catch(function (err) {
        setBusy(sb, false);
        out.appendChild(alertNode(err.code === 'NOT_FOUND' ? '일치하는 접수번호가 없습니다.' : errorMessage(err), 'danger'));
      });
  });

  /* ---- 제출 ---------------------------------------------------------- */
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (btn.disabled) { return; }
    clearFormErrors(form);
    startCooldown(0);   // 끝난 쿨다운 안내문을 지운다

    var bad = validate();
    if (bad) {
      formErrors(form, { code: 'VALIDATION_FAILED', message: bad.message, field: bad.field });
      return;
    }

    var body = {
      username: inUsername.value.trim().toLowerCase(),
      email: inEmail.value.trim(),
      password: inPw.value,
      password_confirm: inPw2.value,
      agree_tos: true,
      agree_privacy: true,
      marketing_agreed: !!cbMarketing.checked
    };
    if (inName.value.trim()) { body.name = inName.value.trim(); }
    if (inNick.value.trim()) { body.nickname = inNick.value.trim(); }
    if (inPhone.value.trim()) { body.phone = inPhone.value.trim(); }
    if (sso.service_id) { body.service_id = sso.service_id; }
    if (regMode === 'approval') {
      /* 설계 130 2-4: 선택 키 redirect_uri / entry / applicant_note */
      if (sso.redirect_uri) { body.redirect_uri = sso.redirect_uri; }
      body.entry = (entryParam === 'sso' || ssoMode) ? 'sso' : 'register_page';
      var note = $('#reg-note').value.trim();
      if (note) { body.applicant_note = note; }
    }

    setBusy(btn, true);

    apiPost('/api/auth/register', body)
      .then(function (data) {
        setBusy(btn, false);
        inPw.value = '';
        inPw2.value = '';
        if (data && data.approval_required === true) { showRequested(data); return; }
        showDone(data);
      })
      .catch(function (err) {
        setBusy(btn, false);
        if (err.code === 'RATE_LIMITED') {
          formBanner(form, errorMessage(err), 'danger');
          startCooldown(err.data && err.data.retry_after);
          return;
        }
        if (err.code === 'REGISTRATION_DISABLED') {
          formBanner(form, errorMessage(err), 'warn');
          btn.disabled = true;
          return;
        }
        if (err.code === 'SSO_INVALID_SERVICE') {
          formBanner(form,
            errorMessage(err) + ' (요청된 service_id: ' + sso.service_id + ') 서비스 등록을 관리자에게 요청해 주세요.',
            'danger');
          return;
        }
        /* DUPLICATE_USERNAME → field:"username" / DUPLICATE_EMAIL → field:"email"
           둘 다 서버가 field 를 채워 주므로 필드 옆에 표시된다. */
        formErrors(form, err);
      });
  });

  renderStrength();

  /* ---- 가입 허용 확인 (v1.8.2) ----------------------------------------
   * GET /api/auth/register_status → data.allow_register (전역 설정).
   * 서버 판정은 POST /api/auth/register 가 거절할 때 쓰는 것과 **같은 함수**다.
   * 폼은 마크업에서 hidden 으로 시작하고 `allow_register === true` 일 때만 연다.
   *   false        → 「현재 신규 가입을 받지 않습니다」 안내 (폼 대신)
   *   값을 못 받음 → 폼을 열지 않고 재시도 안내 (fail-closed. 차단이라고 단정하지도 않는다)
   * 서비스 단위 차단(SSO service 의 allow_register=0)은 여기서 보지 않는다 — 그 판단은
   * login.html 이 sso/validate 로 이미 해 링크를 감추고, 제출 시 서버가 같은 함수로 거절한다.
   * ------------------------------------------------------------------- */
  var elChecking = $('#reg-checking');
  var cardClosed = $('#closed-card');
  var closedBody = $('#closed-body');
  var closedFoot = $('#closed-foot');

  function showClosed(message, type, retry) {
    clear(elChecking);
    elChecking.hidden = true;
    cardReg.hidden = true;
    clear(closedBody);
    closedBody.appendChild(alertNode(message, type));
    var old = $('#closed-retry');
    if (old) { old.parentNode.removeChild(old); }
    if (retry) {
      closedFoot.insertBefore(el('button', {
        class: 'btn btn-secondary btn-sm', type: 'button', id: 'closed-retry',
        on: { click: function () { location.reload(); } }
      }, '다시 시도'), closedFoot.firstChild);
    }
    cardClosed.hidden = false;
  }

  clear(elChecking);
  elChecking.hidden = false;
  elChecking.appendChild(loadingNode('가입 가능 여부를 확인하는 중…'));

  apiGet('/api/auth/register_status')
    .then(function (data) {
      var rm = data && data.register_mode;
      if (data && data.allow_register === true && rm !== 'closed') {
        if (rm === 'approval') {
          regMode = 'approval';
          $('#register-title').textContent = '가입 신청';
          btn.textContent = '가입 신청';
          $('#note-field').hidden = false;
          $('#open-status').hidden = false;
        }
        clear(elChecking);
        elChecking.hidden = true;
        cardClosed.hidden = true;
        cardReg.hidden = false;
        try { inUsername.focus(); } catch (e) { /* noop */ }
        return;
      }
      showClosed('현재 가입을 받지 않습니다.', 'warn', false);
    })
    .catch(function (err) {
      showClosed('가입 가능 여부를 확인하지 못했습니다. ' + errorMessage(err) +
        ' 잠시 후 다시 시도해 주세요.', 'danger', true);
    });
})();
</script>
</body>
</html>
