<!-- 캐시 정책 — 아래 ?v= 와 meta 는 성격이 다르다. 지우기 전에 읽어라.
     자산 URL 의 ?v={버전} 이 배포 반영의 **주 수단**이다. 서버 설정·mod_headers·
     프록시에 전혀 의존하지 않는다 — 버전이 바뀌면 URL 이 바뀌고, 브라우저에게는
     처음 보는 URL 이므로 무조건 새로 받는다. "쿼리스트링이 지저분하다"는 이유로
     지우면 새 버전을 올려도 반영되지 않는 문제가 그대로 돌아온다.
     값 일괄 변경은 tools/bump_asset_version.php 로 한다(손으로 고치지 마라).
     아래 meta 는 **보조 수단이다.** 현대 브라우저는 http-equiv="Cache-Control" 을
     무시할 수 있다(HTTP 헤더만 신뢰). 주 방어는 public/.htaccess 의 no-store 이며,
     이 meta 를 캐시 무효화의 주 수단으로 믿으면 안 된다. -->
<meta http-equiv="Cache-Control" content="no-store">
<!-- 공용 테마 (research-ui G17) — v1.8.6 / 리더 판정 D-337·D-342
     공용 파일 셋(rui-theme.js · rui-tokens.css · rui.css)은 research-ui 원본을 **바이트 그대로** 복사했다.
     ulogin 전용 보정은 따로 둔다:
       · rui-ulogin-pre.js — rui-theme.js 보다 **먼저**. `?rui=` 인계가 SSO 쿼리·일회용 토큰을 지우지 않게
       · rui-layer.css     — rui.css 를 cascade layer 로 불러 style.css 와의 클래스 충돌(D-236)을 푼다
       · ulogin-theme.css  — 화면 모양 보정(G16 로그인 틀 안의 ulogin 고유 요소 · 공통 테마 2 · Pretendard 파일)

       · theme-ui.js       — 화면 설정(RUI.picker, 인라인 style 을 CSSOM 으로 옮긴다) · 밝기 아이콘 갱신

     rui-theme.js 를 **스타일시트보다 먼저, head 에서** 부른다. <html> 에 data-rui-* 를 세우므로
     첫 그리기부터 색이 맞는다(GUIDE "새 앱에 쓰기").

     <html data-rui-font>: RUI.font() 의 jsdelivr 주입을 끈다(CSP style-src·font-src 'self').
     글꼴은 assets/PretendardVariable.woff2 를 직접 둔다(GUIDELINE 3장 — 외부 글꼴을 막는 서버).
     **CSP 를 넓히지 않는다** — 그것이 이 화면들의 방어다. -->

<script src="assets/ulogin-shell.js?v=1.10.2"></script>

<script src="assets/ui.js?v=1.10.2"></script>
<script>
/* ============================================================================
 * login.html — SSO 로그인 + 일반 로그인
 *
 * v1.8.6 — 화면은 G16 `RUI.login()` 이 그린다(GUIDELINE 4-2장, D-337). 이 스크립트가 정하는 것은
 *   옵션 값과 onSubmit 뿐이다. 범용 로그인 자신이라 sso 옵션은 주지 않는다(mode off — 이 시스템 계정).
 *   onSubmit(id, pw) 이 실패하면 **사람이 읽을 문장**을 담은 Error 를 던진다 → 부품이 오류 줄에 보이고
 *   비밀번호 칸을 다시 고른다. 빈 칸 문구·「확인하는 중…」은 부품의 고정 문구다.
 *   제목은 고정 문구 「로그인」이다 — SSO 요청이면 서비스 이름은 제목 아래 안내 줄(#sso-note)에 쓴다.
 *
 * 순서 (auth-ui-builder/SKILL.md "동작 순서"):
 *   1) 쿼리에서 SSO 파라미터를 읽는다
 *   2) 있으면 **먼저** GET /api/sso/validate 로 사전 검증한다
 *   3) 실패하면 리다이렉트하지 않고 화면에 오류를 표시하고 폼을 숨긴다
 *   4) 성공하면 **무음 인가를 한 번 시도한다** (v1.7.0 신규 — 아래 3-a)
 *   5) 무음이 안 되면 안내 줄에 "{service_name} 로그인 요청" 을 표시하고 폼을 연다
 *   6) 제출 → POST /api/sso/authorize → data.redirect_to 를 그대로 location.replace()
 *   7) SSO 파라미터가 없으면 POST /api/auth/login 후 mypage.html
 *
 * 3-a) 무재인증(무음) SSO — v1.7.0 (설계 §2-4)
 *   validate 성공 직후, **비밀번호 폼을 그리기 전에**
 *   POST /api/sso/authorize_session 을 한 번 부른다. 쿠키 세션이 이미 있으면
 *   서버가 기존 authorize 와 **같은 모양**의 {redirect_to, code, state, expires_in}
 *   을 돌려주고, 화면은 그대로 location.replace() 한다.
 *   - 401(AUTH_REQUIRED) 은 **오류가 아니다.** "무음이 안 됐다"는 뜻이고
 *     정상 동작으로서 비밀번호 폼을 그린다.
 *   - state · code_challenge 가 쿼리에 없으면 **아예 부르지 않는다.**
 *     그 경로는 둘 다 필수라 400 을 받을 것이 확정이다(설계 §A-4 — 기존
 *     authorize 는 선택, 무음 경로만 필수. 이 비대칭은 의도다).
 *   - 왕복이 짧으므로 로딩 표시를 유지한다. 폼이 깜빡였다 사라지지 않게 한다.
 * ========================================================================== */
(function () {
  'use strict';

  /* ---- SSO 파라미터 -------------------------------------------------- */
  /* references/redirect-flow.md 의 withSso() 유지 대상 4개 */
  var SSO_KEEP = ['service_id', 'redirect_uri', 'state', 'code_challenge'];

  var qs = new URLSearchParams(location.search);
  function param(k) { var v = qs.get(k); return v === null ? '' : v.trim(); }

  var sso = {
    service_id: param('service_id'),
    redirect_uri: param('redirect_uri'),
    state: param('state'),
    code_challenge: param('code_challenge'),
    prompt: param('prompt')
  };

  /* v1.7.0 — 종전 주석("계약에 무인(silent) authorize 경로가 없어 prompt 유무로
     분기할 것이 없다")의 전제가 **둘 다** 바뀌었다.

     ① 무음 경로 POST /api/sso/authorize_session 이 생겼다(설계 §A-1 다안).
     ② 그래서 `sso.prompt` 를 **실제로 읽는 코드가 생겼다** — trySilentAuthorize()
        가 `prompt=login`(재인증 요구)이면 무음을 건너뛴다(리더 판정 2).

     그 한 값만 본다. `prompt=none`·`consent`·`select_account` 등 나머지는
     여전히 구현하지 않는다(설계 §7) — `prompt=none` 에 해당하는 동작은 이미
     전용 엔드포인트가 맡고, 나머지는 이 배포에 쓸 곳이 없다. */

  /* 하나라도 들어왔으면 SSO 요청으로 본다. 둘 다 있어야 유효하다. */
  var ssoRequested = !!(sso.service_id || sso.redirect_uri);
  var ssoReady = false;   // validate 성공 후에만 true. 이 값이 false면 authorize를 부르지 않는다.

  /** 현재 SSO 파라미터를 유지한 채 다른 화면으로 가는 URL을 만든다. */
  function withSso(target) {
    var next = new URLSearchParams();
    SSO_KEEP.forEach(function (k) {
      if (qs.has(k) && qs.get(k) !== '') { next.set(k, qs.get(k)); }
    });
    var q = next.toString();
    return q ? target + '?' + q : target;
  }

  /* ---- 저장소 안전 접근 (프라이버시 모드에서 throw할 수 있다) ---------- */
  var ID_KEY = 'ulogin_saved_username';
  var PREFILL_KEY = 'ulogin_prefill_username';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* noop */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* noop */ } }
  function ssTake(k) {
    try { var v = sessionStorage.getItem(k); if (v !== null) { sessionStorage.removeItem(k); } return v; }
    catch (e) { return null; }
  }

  /* ---- G16 공통 로그인 화면 -------------------------------------------
   * 공용 부품이 없으면(rui-theme.js 를 못 읽음) 로그인할 수 없다. 조용히 빈 화면을 두지 않고
   * 이유를 보인다. */
  var shellHost = $('#ul-shell');
  if (!window.RUI || typeof RUI.login !== 'function' || !window.ULOGIN_SHELL) {
    shellHost.appendChild(alertNode('화면 구성 파일을 읽지 못했습니다. 새로 고침해 주세요.', 'danger'));
    return;
  }

  var login = RUI.login(shellHost, {
    self: 'ulogin',
    version: ULOGIN_SHELL.version(),
    tagline: ULOGIN_SHELL.TAGLINE,
    desc: ULOGIN_SHELL.DESC,
    systems: true,
    idLabel: '아이디 또는 이메일',
    idAuto: 'username',
    help: '계정 없음 시 관리자 문의',
    onSubmit: submitLogin
  });

  /* ---- 엘리먼트 ------------------------------------------------------ */
  var form = $('.rui-login-form', shellHost);        // 부품이 그린 로그인 폼(= 로그인 칸)
  var mainEl = $('.rui-login-main', shellHost);
  var inUser = form.querySelector('[name=u]');
  var inPass = form.querySelector('[name=p]');
  var btn = form.querySelector('.rui-login-go');
  var errLine = form.querySelector('.rui-login-err');

  /* 부품의 입력칸에 이 화면이 쓰던 id·속성을 단다(라벨은 부품이 감싸서 이미 연결돼 있다). */
  inUser.id = 'username';
  inUser.setAttribute('autocapitalize', 'off');
  inUser.setAttribute('autocorrect', 'off');
  inUser.setAttribute('spellcheck', 'false');
  inPass.id = 'password';

  var parts = $('#ul-login-parts');
  var ssoNote = $('#sso-note');
  var banner = $('#login-banner');
  var checks = $('#login-checks');
  var cbSaveId = $('#remember-id');
  var cbRemember = $('#remember');
  var coolNote = $('#cooldown-note');
  var linkRow = $('#link-row');

  var cardResend = $('#resend-card');
  var formResend = $('#resend-form');
  var inResendEmail = $('#resend-email');
  var btnResend = $('#resend-btn');
  var resendNote = $('#resend-note');

  var elValidating = $('#validating');
  var cardErr = $('#sso-error-card');
  var errTitle = $('#sso-error-title');
  var errBody = $('#sso-error-body');
  var errFoot = $('#sso-error-foot');

  var linkRegister = $('#link-register');
  var linkForgot = $('#link-forgot');
  var siteLine = $('#login-site');
  var footerSite = $('#footer-site');

  /* 제자리로 옮긴다: 안내 줄 아래(안내·배너) · 비밀번호 칸 아래(체크) · 오류 줄 아래(남은 시간) ·
     도움말 위(링크) · 폼 바로 아래(재발송) · 폼 대신(확인 중·SSO 오류). */
  var hint = form.querySelector('[data-hint]');
  hint.parentNode.insertBefore(banner, hint.nextSibling);
  hint.parentNode.insertBefore(ssoNote, hint.nextSibling);
  errLine.parentNode.insertBefore(checks, errLine);
  errLine.parentNode.insertBefore(coolNote, errLine.nextSibling);
  var helpLine = form.querySelector('.rui-login-help');
  form.insertBefore(linkRow, helpLine);
  form.appendChild(siteLine);            // 도움말 아래 작은 글씨
  mainEl.appendChild(cardResend);        // 폼 안에 넣지 않는다(폼 안의 폼은 submit 이 바깥 폼으로 올라간다)
  mainEl.appendChild(elValidating);
  mainEl.appendChild(cardErr);
  parts.parentNode.removeChild(parts);

  /* 폼은 검증이 끝나 showLoginForm() 이 부를 때만 보인다. */
  form.hidden = true;

  /* ---- 공용: 쿨다운 카운트다운 --------------------------------------- */
  /* api.js/ui.js 에 카운트다운 기능이 없어 화면에서 자체 구현한다.
     부품은 onSubmit 이 끝나면 버튼을 다시 켠다 — 그래서 제출 실패에서 시작하는 쿨다운은
     **부품이 버튼을 켠 다음**(setTimeout 0)에 건다. coolActive() 가 그동안의 재제출을 막는다. */
  function makeCooldown(button, noteEl, prefix) {
    var timer = null;
    var start = function (seconds, label) {
      var left = Math.max(0, Math.floor(Number(seconds) || 0));
      if (timer) { clearInterval(timer); timer = null; }
      if (!left) { button.disabled = false; noteEl.hidden = true; noteEl.textContent = ''; return; }
      button.disabled = true;
      noteEl.hidden = false;
      var head = label || prefix;
      var tick = function () {
        if (left <= 0) {
          clearInterval(timer); timer = null;
          button.disabled = false;
          noteEl.textContent = '다시 시도할 수 있습니다.';
          return;
        }
        noteEl.textContent = head + ' ' + fmtDuration(left) + ' 남았습니다.';
        left -= 1;
      };
      tick();
      timer = setInterval(tick, 1000);
    };
    start.active = function () { return timer !== null; };
    return start;
  }
  var coolSubmit = makeCooldown(btn, coolNote, '다시 시도까지');
  var coolResend = makeCooldown(btnResend, resendNote, '다시 보낼 수 있을 때까지');
  function coolSubmitLater(seconds, label) {
    setTimeout(function () { coolSubmit(seconds, label); }, 0);
  }

  /** retry_after(초) 우선, 없으면 locked_until(ISO8601)에서 남은 초를 계산한다. */
  function secondsFrom(data) {
    if (!data) { return 0; }
    if (typeof data.retry_after === 'number' && data.retry_after > 0) { return data.retry_after; }
    if (data.locked_until) {
      var t = new Date(data.locked_until).getTime();
      if (!isNaN(t)) { return Math.max(0, Math.ceil((t - Date.now()) / 1000)); }
    }
    return 0;
  }

  /* ---- SSO 오류 화면 -------------------------------------------------- */
  function kvRow(label, value) {
    return el('div', { class: 'field' }, [
      el('span', { class: 'field-label', text: label }),
      el('code', { class: 'mono text-sm', text: value === '' || value === null ? '(없음)' : String(value) })
    ]);
  }

  /**
   * SSO 오류 화면을 띄우고 로그인 폼을 숨긴다.
   * @param {string} title
   * @param {string} message
   * @param {object} opts { showParams:bool, whitelistHint:bool, retry:bool }
   */
  function showSsoError(title, message, opts) {
    opts = opts || {};
    form.hidden = true;
    cardResend.hidden = true;
    elValidating.hidden = true;
    clear(errBody);
    clear(errFoot);

    errTitle.textContent = title;
    errBody.appendChild(alertNode(message, 'danger'));

    if (opts.showParams) {
      errBody.appendChild(el('div', { class: 'stack' }, [
        kvRow('요청된 service_id', sso.service_id),
        kvRow('요청된 redirect_uri', sso.redirect_uri)
      ]));
    }
    if (opts.whitelistHint) {
      errBody.appendChild(el('p', { class: 'text-sm text-muted' },
        '이 주소는 서비스의 복귀 주소 화이트리스트에 등록되어 있지 않습니다. ' +
        '위 redirect_uri를 그대로 로그인 서버 관리자에게 전달해 화이트리스트 등록을 요청해 주세요. ' +
        '보안을 위해 등록 전에는 어떤 경우에도 해당 주소로 이동하지 않습니다.'));
    }
    if (opts.retry) {
      errFoot.appendChild(el('button', {
        class: 'btn btn-secondary', type: 'button',
        on: { click: function () { location.reload(); } }
      }, '다시 시도'));
    }
    errFoot.appendChild(el('a', { class: 'btn btn-ghost', href: 'index.html' }, '처음으로'));
    cardErr.hidden = false;
  }

  /* ---- 회원가입 링크 (v1.8.2) -----------------------------------------
   * 링크는 마크업에서 `hidden` 으로 시작한다. **허용이 확인된 때만** 보인다(fail-closed) —
   * 값을 못 받았거나(네트워크·5xx·레이트리밋) 모양이 이상하면 감춘 채로 둔다.
   *   SSO 진입: `sso/validate` 의 allow_register (전역 AND 서비스)
   *   그 밖   : GET /api/auth/register_status 의 allow_register (전역)
   * 두 값 모두 서버의 같은 판정 함수(registration_open)에서 나온다. 가입 API 가 실제로
   * 거절하는 조건과 같으므로 「링크는 보이는데 가입은 막힌다」가 생기지 않는다.
   * ------------------------------------------------------------------- */
  function applyRegisterLink(info) {
    linkRegister.hidden = true;
    if (info) {
      linkRegister.hidden = (info.allow_register !== true || info.register_mode === 'closed');
      linkRegister.textContent = (info.register_mode === 'approval') ? '가입 신청' : '회원가입';
      return;
    }
    apiGet('/api/auth/register_status')
      .then(function (data) {
        linkRegister.hidden = !(data && data.allow_register === true && data.register_mode !== 'closed');
        linkRegister.textContent = (data && data.register_mode === 'approval') ? '가입 신청' : '회원가입';
      })
      .catch(function () { linkRegister.hidden = true; });
  }

  /* ---- 로그인 폼 노출 ------------------------------------------------- */
  function showLoginForm(info) {
    elValidating.hidden = true;
    cardErr.hidden = true;

    /* 제목은 고정 문구 「로그인」(GUIDELINE 4-2 고정 문구표). 서비스 이름은 안내 줄 아래에 쓴다. */
    clear(ssoNote);
    ssoNote.hidden = true;
    if (info && info.service_name) {
      ssoNote.appendChild(el('strong', { text: String(info.service_name) }));
      ssoNote.appendChild(text(' 로그인 요청입니다. '));
    }

    if (info && info.site_name) {
      footerSite.textContent = info.site_name;
    }

    applyRegisterLink(info);

    /* requires_pkce=true 인데 code_challenge 가 안 왔으면 교환 단계에서 실패한다.
       로그인 자체는 막지 않고 경고만 띄운다. */
    if (info && info.requires_pkce === true && !sso.code_challenge) {
      banner.appendChild(
        alertNode('이 서비스는 PKCE(code_challenge)가 필수입니다. 요청에 code_challenge가 없어 ' +
                  '로그인 후 코드 교환이 실패할 수 있습니다. 앱을 HTTPS 또는 localhost에서 실행해 주세요.',
                  'warn')
      );
      ssoNote.hidden = !ssoNote.firstChild;
    } else if (ssoReady) {
      ssoNote.appendChild(text('로그인 후 요청한 앱으로 복귀'));
      ssoNote.hidden = false;
    }

    form.hidden = false;
    /* 아이디가 이미 채워져 있으면 비밀번호로 포커스를 옮긴다. */
    try { (inUser.value ? inPass : inUser).focus(); } catch (e) { /* noop */ }
  }

  /* ---- 무재인증(무음) SSO — v1.7.0 ------------------------------------
   * 설계 §2-2 · §2-4. validate 를 통과한 뒤 **폼을 그리기 전에** 한 번만 부른다.
   *
   * 이 함수가 성공하면 사용자는 비밀번호를 보지 않고 원래 앱으로 돌아간다.
   * 실패는 거의 전부 **정상**이다 — 로그인 안 한 사람이 대부분이기 때문이다.
   * 그래서 기본 동작은 "조용히 폼으로 떨어진다" 이고, 오류 화면으로 가는 것은
   * **복귀 주소·서비스 자체가 틀렸을 때뿐**이다(그 둘은 폼을 열어 봐야 제출이
   * 같은 이유로 거절된다).
   * ------------------------------------------------------------------- */
  function trySilentAuthorize(info) {
    /* `prompt=login` 은 **재인증 요구**다. 무음을 건너뛰고 비밀번호를 다시 묻는다.
       (리더 판정 2 · 2026-11-10)

       설계 §7 은 「OIDC prompt 파라미터 전체」를 구현하지 않기로 했고 그 판정은
       **서버 쪽에 그대로 유효하다** — 새 엔드포인트는 prompt 를 보지 않는다.
       여기서 하는 것은 화면이 **무음을 시도할지 말지**를 고르는 것뿐이라
       서버 변경이 0 이고 계약도 건드리지 않는다.

       왜 무시하면 안 되나: 연동 앱이 민감한 작업 앞에서 재인증을 요구하는 것은
       정당한 요구다. 무음이 먼저 끼어들면 그 요구가 **조용히** 무시된다 —
       앱은 사람이 비밀번호를 다시 넣었다고 믿는데 실제로는 아니다.
       7개 시스템이 지금 이 값을 보내는지는 모른다. **보내든 안 보내든
       무시하지 않는 쪽이 맞다.** */
    if (sso.prompt === 'login') { showLoginForm(info); return; }

    /* 무음 경로는 state·code_challenge 가 **필수**다(설계 §A-4). 둘 중 하나라도
       없으면 400 이 확정이므로 요청 자체를 보내지 않는다 — 레이트리밋 버킷
       (sso_silent:ip 60/300)을 헛되이 소모하지 않기 위해서이기도 하다. */
    if (!sso.state || !sso.code_challenge) { showLoginForm(info); return; }

    /* 폼 깜빡임 방지 — 왕복이 끝날 때까지 로딩 표시를 유지한다. */
    clear(elValidating);
    elValidating.hidden = false;
    elValidating.appendChild(loadingNode('로그인 상태를 확인하는 중…'));

    apiPost('/api/sso/authorize_session', {
      service_id: sso.service_id,
      redirect_uri: sso.redirect_uri,
      state: sso.state,
      code_challenge: sso.code_challenge,
      code_challenge_method: 'S256'
    })
      .then(function (data) {
        /* 응답 키 4개는 기존 authorize 와 같다(설계 §2-2). 서버가 준 문자열을
           그대로 쓴다 — URL 을 프론트에서 조립하지 않는다. */
        if (!data || !data.redirect_to) { showLoginForm(info); return; }
        location.replace(data.redirect_to);
      })
      .catch(function (err) {
        /* 세션이 없다 = 무음 불가. **오류로 표시하지 않는다**(설계 §2-2 주석). */
        if (err.code === 'AUTH_REQUIRED' || err.code === 'AUTH_SESSION_EXPIRED') {
          showLoginForm(info);
          return;
        }
        /* ── 여기서부터 **모든** 오류가 같은 길로 간다: 폼을 열고 안내만 띄운다 ──
         *
         * 리더 판정 3 (2026-11-10): **무음 경로의 어떤 오류도 비밀번호 폼을
         * 막아서는 안 된다.** 무음과 비밀번호는 레이트리밋 버킷부터 갈라져 있고
         * (`sso_silent:*` 대 `login:*`, 설계 §A-5) 받는 자격증명도 다르다.
         * 한쪽의 실패를 다른 쪽에 전가하면 설계가 버킷을 나눈 이유를 화면이
         * 되돌린다.
         *
         * 처음에는 `SSO_INVALID_SERVICE`·`SSO_INVALID_REDIRECT` 를 오류 화면으로
         * 보냈다(폼을 숨긴다). **그것이 틀렸다는 것을 이 판정을 받고 알았다.**
         * 두 경로의 거절 규칙이 **같지 않기 때문**이다 — 무음 경로에는
         * 「`redirect_uri` 의 scheme 이 https 여야 한다」가 **추가로** 걸려 있다
         * (설계 §B-4). 즉 화이트리스트에 등록된 `http://127.0.0.1:8101/sso/callback`
         * 같은 항목은 **무음에서는 SSO_INVALID_REDIRECT 인데 비밀번호 경로에서는
         * 정상으로 통과한다**(기존 `authorize.php` 에는 그 규칙이 없다 — D-234 가
         * 「한 줄도 고치지 않는다」로 못박았다).
         * 그걸 오류 화면으로 보내면 **무음 전용 규칙이 비밀번호 로그인을 막는다.**
         *
         * 복귀 주소가 정말로 잘못됐다면 제출 시점에 `handleLoginError()` 가
         * 같은 코드를 받아 그때 오류 화면을 띄운다. 판정 자리를 한 곳으로 둔다.
         *
         * 쿨다운(`coolSubmit`)은 **어떤 분기에서도 걸지 않는다.** 상태를 하나
         * 늘리면 그 상태가 다시 폼을 잠글 수 있다.
         *
         * ── `FORBIDDEN` 은 배너도 띄우지 않는다 (리더 판정 D-288 · QA Q17-11) ──
         * 무음 경로의 403 은 **예상된 상태**다. 대표가 `is_confidential=0` 서비스
         * (보안 M17-5 — 서비스 시크릿 없이 교환되는 서비스에는 무음 code 를 내주지
         * 않는다). 그 서비스로 들어올 때마다 경고를 띄우면 **정상 상태가 경보가
         * 된다** — `db_port_pinned=false` 에 내린 판정(D-263)과 같은 논리다.
         * 운영자가 알아야 할 사실은 관리자 콘솔의 서비스 수정 화면에 **정적으로**
         * 적어 두었다(`is_confidential` 체크박스 설명).
         *
         * 같은 403 이 오는 다른 경우도 조용히 내려가도 잃는 것이 없다:
         *   · 서비스 이용 제한(membership blocked) — 비밀번호로 제출하면 같은 거절을
         *     **그때** `handleLoginError()` 가 보여 준다
         *   · Bearer 인증 · 평문 http 요청 — 이 화면은 쿠키로 공개 https 에서만 쓰인다
         *     (설계 §B-2). 사실상 도달하지 않는다 */
        showLoginForm(info);
        /* ── `SSO_INVALID_REDIRECT` 도 배너 없이 (리더 판정 · D-288 적용 확대) ──
         * 무음 경로가 http 복귀 주소를 거절하는 것은 **설계대로다**(설계 §B-4 · D-235 —
         * 내부 주소 항목은 무음으로 도달 불가, 비밀번호 경로로만 쓴다). 시험용 내부
         * 주소로 들어올 때마다 경고를 띄우면 정상이 경보가 된다.
         * **정보 손실이 없다** — 주소가 정말 잘못됐으면 **제출 시점에** 비밀번호
         * 경로가 같은 코드를 받아 `handleLoginError()` 가 오류 화면을 띄운다(D-260). */
        if (err.code === 'FORBIDDEN' || err.code === 'SSO_INVALID_REDIRECT') { return; }
        formBanner(banner, errorMessage(err) + ' 비밀번호로 로그인해 주세요.', 'warn');
      });
  }

  /* ---- 아이디 저장 / 가입 직후 프리필 --------------------------------- */
  (function restoreUsername() {
    var prefill = ssTake(PREFILL_KEY);     // register.html 이 방금 넘긴 값 (1회성)
    var saved = lsGet(ID_KEY);
    if (prefill) {
      inUser.value = prefill;
    } else if (saved) {
      inUser.value = saved;
      cbSaveId.checked = true;
    }
  })();

  /* ---- 링크에 SSO 파라미터 유지 --------------------------------------- */
  linkRegister.setAttribute('href', withSso('register.html'));
  linkForgot.setAttribute('href', withSso('forgot.html'));

  /* ---- 이메일 인증 재발송 -------------------------------------------- */
  function showResend(email) {
    cardResend.hidden = false;
    if (email && !inResendEmail.value) { inResendEmail.value = email; }
    if (!inResendEmail.value) {
      var typed = inUser.value.trim();
      if (typed.indexOf('@') !== -1) { inResendEmail.value = typed; }
    }
    try { cardResend.scrollIntoView({ block: 'nearest' }); } catch (e) { /* noop */ }
  }

  formResend.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (btnResend.disabled) { return; }
    clearFormErrors(formResend);
    coolResend(0);
    var email = inResendEmail.value.trim();
    if (!email || email.indexOf('@') === -1) {
      formErrors(formResend, { code: 'VALIDATION_FAILED', message: '이메일 주소를 입력해 주세요.', field: 'email' });
      return;
    }
    setBusy(btnResend, true);
    /* D-9 의 신규 엔드포인트. 논리 경로를 쓴다 — D-17 로 api.js 의
       ULOGIN_PATH_ALIASES 에 '/api/auth/email/resend' → email_resend 별칭이 추가되었다. */
    apiPost('/api/auth/email/resend', { email: email })
      .then(function (data) {
        setBusy(btnResend, false);
        var msg = (data && data.message) || '인증 메일을 보냈습니다.';
        formBanner(formResend, msg, 'success');
        if (data && data.expires_in) {
          resendNote.hidden = false;
          resendNote.textContent = '링크는 ' + fmtDuration(data.expires_in) + ' 동안 유효합니다.';
        }
      })
      .catch(function (err) {
        setBusy(btnResend, false);
        if (err.code === 'RATE_LIMITED') {
          formBanner(formResend, errorMessage(err), 'danger');
          coolResend(secondsFrom(err.data));
          return;
        }
        formErrors(formResend, err);
      });
  });

  /* ---- 로그인 실패 처리 ---------------------------------------------- */
  var STATUS_MESSAGES = {
    AUTH_ACCOUNT_SUSPENDED:
      '정지된 계정입니다. 정지 사유와 해제 절차는 로그인 서버 관리자에게 문의해 주세요.',
    AUTH_ACCOUNT_DORMANT:
      '휴면 상태의 계정입니다. 휴면 해제는 관리자가 처리합니다. 관리자에게 해제를 요청해 주세요.',
    AUTH_ACCOUNT_WITHDRAWN:
      '탈퇴 처리된 계정입니다. 이 계정으로는 로그인할 수 없습니다. 다시 이용하시려면 새로 가입해 주세요.',
    AUTH_ACCOUNT_PENDING:
      '승인 대기 중인 계정입니다. 관리자 승인 후 로그인할 수 있습니다.'
  };

  /**
   * 실패를 처리하고, 부품의 오류 줄에 보일 문장을 돌려준다(null = 이미 다른 화면으로 처리함).
   * error.field 가 있어도 문장은 오류 줄 한 곳에 보인다(G16 「오류 한 줄」) — 부품이 비밀번호 칸을 다시 고른다.
   */
  function handleLoginError(err) {
    if (Object.prototype.hasOwnProperty.call(STATUS_MESSAGES, err.code)) {
      return STATUS_MESSAGES[err.code];
    }
    if (err.code === 'AUTH_EMAIL_UNVERIFIED') {
      showResend(err.data && err.data.email);
      return errorMessage(err);
    }
    if (err.code === 'AUTH_ACCOUNT_LOCKED') {
      coolSubmitLater(secondsFrom(err.data), '잠금 해제까지');
      return errorMessage(err);
    }
    if (err.code === 'RATE_LIMITED') {
      coolSubmitLater(secondsFrom(err.data));
      return errorMessage(err);
    }
    if (err.code === 'SSO_INVALID_SERVICE' || err.code === 'SSO_INVALID_REDIRECT') {
      /* 검증을 통과했는데 authorize 에서 거절됐다 — 그 사이에 설정이 바뀐 경우다.
         리다이렉트하지 않고 오류 화면으로 전환한다. */
      showSsoError('복귀 주소를 확인할 수 없습니다', errorMessage(err), {
        showParams: true,
        whitelistHint: err.code === 'SSO_INVALID_REDIRECT'
      });
      return null;
    }
    return errorMessage(err);
  }

  /** 이동이 시작되면 부품이 버튼을 다시 켜지 않게 끝나지 않는 약속을 돌려준다. */
  function leaving() { return new Promise(function () { /* 페이지가 바뀐다 */ }); }

  /* ---- 제출 (RUI.login 의 onSubmit) -----------------------------------
   * 부품이 빈 칸을 먼저 막고(「아이디를 입력하세요.」 등 고정 문구) 버튼을 「확인하는 중…」으로 바꾼 뒤 부른다.
   * 비밀번호는 어떤 경우에도 저장하지 않는다. */
  function submitLogin(username, password) {
    if (coolSubmit.active()) {
      /* 부품이 끝나면 버튼을 켜므로 쿨다운 표시를 다시 건다. */
      setTimeout(function () { btn.disabled = true; }, 0);
      return Promise.reject(new Error(coolNote.textContent || '잠시 후 다시 시도해 주세요.'));
    }
    clearFormErrors(banner);
    clear(banner);
    coolSubmit(0);              // 끝난 쿨다운 안내문을 지운다
    cardResend.hidden = true;   // 직전 시도의 재발송 안내를 남기지 않는다

    /* 아이디만 저장한다. 비밀번호는 어떤 경우에도 저장하지 않는다. */
    if (cbSaveId.checked) { lsSet(ID_KEY, username); } else { lsDel(ID_KEY); }

    var fail = function (err) {
      var msg = handleLoginError(err);
      if (msg) { throw new Error(msg); }
    };

    if (ssoReady) {
      var body = {
        username: username,
        password: password,
        service_id: sso.service_id,
        redirect_uri: sso.redirect_uri
      };
      if (sso.state) { body.state = sso.state; }
      if (sso.code_challenge) {
        body.code_challenge = sso.code_challenge;
        body.code_challenge_method = 'S256';
      }
      return apiPost('/api/sso/authorize', body)
        .then(function (data) {
          /* 서버가 준 문자열을 그대로 쓴다. URL을 프론트에서 조립하지 않는다.
             외부 절대 URL이므로 guardRedirect() 를 통과시키지 않는다(내부 경로 전용). */
          if (!data || !data.redirect_to) {
            throw new Error('서버가 복귀 주소를 반환하지 않았습니다. 관리자에게 문의해 주세요.');
          }
          inPass.value = '';
          location.replace(data.redirect_to);
          return leaving();
        }, fail);
    }

    /* 일반 로그인 모드 */
    var loginBody = { username: username, password: password };
    if (cbRemember.checked) { loginBody.remember = true; }
    /* device_label 은 보내지 않는다 — 서버가 User-Agent 로 만든다(device_label_from_ua). */

    return apiPost('/api/auth/login', loginBody)
      .then(function () {
        /* 응답의 access_token 은 저장하지 않는다. 로그인 서버 UI 는 쿠키 세션(ULOGIN_SID)을 쓴다. */
        inPass.value = '';
        navigate('mypage.html', true);
        return leaving();
      }, fail);
  }

  /* ---- 시작 ---------------------------------------------------------- */
  if (!ssoRequested) {
    /* 일반 로그인 모드 */
    showLoginForm(null);
    return;
  }

  /* SSO 파라미터가 반쪽만 온 경우 — 검증할 수 없으므로 폼을 열지 않는다. */
  if (!sso.service_id || !sso.redirect_uri) {
    showSsoError(
      '로그인 요청이 올바르지 않습니다',
      'SSO 로그인에는 service_id와 redirect_uri가 모두 필요합니다. ' +
      (!sso.service_id ? 'service_id가 없습니다. ' : '') +
      (!sso.redirect_uri ? 'redirect_uri가 없습니다. ' : '') +
      '앱의 로그인 요청 URL을 확인해 주세요.',
      { showParams: true }
    );
    return;
  }

  /* 사전 검증 — 반드시 폼보다 먼저 */
  clear(elValidating);
  elValidating.hidden = false;
  elValidating.appendChild(loadingNode('로그인 요청을 확인하는 중…'));

  /* 검증이 성공하기 전에는 폼을 열지 않는다. 실패·불명 상태에서 폼을 열면
     검증되지 않은 redirect_uri 로 이동할 경로가 생긴다. */
  apiGet('/api/sso/validate', { service_id: sso.service_id, redirect_uri: sso.redirect_uri })
    .then(function (data) {
      if (!data || data.redirect_uri_valid !== true) {
        /* 200 이지만 유효하지 않다고 나온 경우 — 폼을 열지 않는다. */
        showSsoError('허용되지 않은 복귀 주소입니다',
          '요청한 복귀 주소가 이 서비스에 등록되어 있지 않습니다.',
          { showParams: true, whitelistHint: true });
        return;
      }
      ssoReady = true;
      /* v1.7.0 — 폼을 바로 열지 않고 무음 인가를 먼저 시도한다.
         실패하면 trySilentAuthorize() 안에서 showLoginForm(data) 를 부른다. */
      trySilentAuthorize(data);
    })
    .catch(function (err) {
      if (err.code === 'SSO_INVALID_REDIRECT') {
        showSsoError('허용되지 않은 복귀 주소입니다', errorMessage(err),
          { showParams: true, whitelistHint: true });
        return;
      }
      if (err.code === 'SSO_INVALID_SERVICE') {
        showSsoError('서비스 등록이 필요합니다',
          errorMessage(err) + ' 아래 service_id로 로그인 서버에 서비스 등록을 요청해 주세요.',
          { showParams: true });
        return;
      }
      if (err.code === 'VALIDATION_FAILED') {
        showSsoError('로그인 요청이 올바르지 않습니다', errorMessage(err), { showParams: true });
        return;
      }
      /* NETWORK_ERROR / SERVER_ERROR / RATE_LIMITED — 검증을 못 했으므로 폼을 열지 않는다.
         검증되지 않은 redirect_uri 로는 절대 이동하지 않는다. */
      showSsoError('로그인 요청을 확인할 수 없습니다',
        errorMessage(err) + ' 검증에 성공하기 전에는 복귀 주소로 이동하지 않습니다.',
        { showParams: true, retry: true });
    });

})();
</script>
</body>
</html>
